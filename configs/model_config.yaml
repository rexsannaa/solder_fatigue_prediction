# 混合PINN-LSTM模型配置文件
# 用於銲錫接點疲勞壽命預測

# 模型架構參數
model:
  name: "SimplifiedHybridPINNLSTM"  # 更新模型名稱
  description: "簡化版混合物理資訊神經網絡和長短期記憶網絡，強調直接物理計算"
  
  # 輸入特徵參數保持不變
  input:
    static_features: ["Die", "stud", "mold", "PCB", "Unit_warpage"]
    time_series_features: ["NLPLWK_up_", "NLPLWK_down_"]
    time_steps: 4
  
  # PINN分支參數 - 大幅簡化
  pinn:
    hidden_layers: [16]                   # 改為單層隱藏層
    activation: "leaky_relu"              # 改用LeakyReLU以避免死神經元
    dropout_rate: 0.1                     # 降低Dropout率，避免過度正則化
    use_batch_norm: true                  # 保持BatchNorm
    use_physics_layer: true               # 保持物理層
    physics_layer_trainable: false        # 固定物理層參數
  
  # LSTM分支參數 - 大幅簡化
  lstm:
    hidden_size: 32                       # 降低隱藏層大小
    num_layers: 1                         # 減少為單層LSTM
    bidirectional: true                   # 保持雙向特性
    dropout_rate: 0.1                     # 降低Dropout率
    use_attention: true                   # 保持注意力機制
  
  # 特徵融合參數 - 簡化
  fusion:
    fusion_dim: 16                        # 降低融合維度
    use_attention_gate: false             # 移除注意力門控機制
    ensemble_method: "weighted"           # 使用簡單加權平均
    pinn_weight_init: 0.5                 # 平衡兩個分支權重
    lstm_weight_init: 0.5                 # 平衡兩個分支權重
  
  # 物理約束參數 - 調整
  physics:
    a_coefficient: 55.83                  # 保持不變
    b_coefficient: -2.259                 # 保持不變
    enforce_constraints: true             # 保持不變
    scale_correction_factor: 0.22          # 調整為新的直接計算校正因子
  
  # 輸出參數
  use_log_transform: true                 # 保持不變
  output_scale_init: 1.0                  # 保持不變

# 訓練參數
training:
  # 資料分割保持不變
  data_split:
    test_size: 0.15
    val_size: 0.15
    random_seed: 42
  
  # 批次大小保持不變
  batch_size: 8
  
  # 優化器 - 降低學習率
  optimizer:
    name: "adam"
    learning_rate: 0.0003                 # 降低學習率以適應簡化模型
    weight_decay: 0.001                   # 保持不變
  
  # 學習率調度保持不變
  lr_scheduler:
    name: "cosine"
    T_max: 150
    min_lr: 0.00001
  
  # 損失函數 - 調整權重
  loss:
    type: "adaptive"
    initial_lambda_physics: 5.0           # 顯著增加物理約束初始權重
    max_lambda_physics: 10.0              # 顯著增加物理約束最大權重
    initial_lambda_consistency: 0.2       # 降低一致性損失權重
    max_lambda_consistency: 0.5           # 降低一致性損失最大權重
    initial_delta_w_weight: 5.0           # 增加delta_w預測初始權重
    max_delta_w_weight: 8.0               # 增加delta_w預測最大權重
    epochs_to_max: 50                     # 保持不變
  
  # 訓練控制保持不變
  epochs: 300
  early_stopping:
    patience: 40
    min_delta: 0.0005
    monitor: "val_loss"
    mode: "min"
    restart_threshold: 10
  
  # 梯度裁剪降低
  clip_grad_norm: 0.5                     # 降低梯度裁剪，適應較小的網絡

# 資料預處理
preprocessing:
  # 特徵標準化
  scaler_type: "standard"                                             # 標準化類型: standard, minmax
  
  # 時間序列處理
  time_series:
    normalize_each_feature: true                                      # 是否對每個特徵單獨標準化
    normalize_each_sample: false                                      # 是否對每個樣本單獨標準化
    
  # 目標值處理
  target:
    log_transform: true                                               # 啟用目標值對數轉換
    normalize: false                                                  # 是否標準化目標值

# 評估指標
evaluation:
  metrics: ["rmse", "r2", "mae", "mape", "rel_error_mean", "rel_error_median", "log_rmse"]
  # 對數尺度評估
  use_log_metrics: true                                               # 是否使用對數尺度評估

# 路徑配置
paths:
  data: "data/raw/Training_data_warpage_final_20250321_v1.2.csv"     # 資料路徑
  output_dir: "outputs"                                               # 輸出目錄
  model_save_dir: "outputs/models"                                    # 模型保存目錄
  tensorboard_dir: "outputs/logs"                                     # TensorBoard日誌目錄

# 隨機種子設定
random_seed: 42                                                       # 全局隨機種子

# 硬體加速設定
device: "cuda"                                                        # 計算設備: cuda, cpu
num_workers: 0                                                        # 資料載入工作執行緒數量
pin_memory: true                                                      # 是否使用固定內存

# 調試選項
debug:
  verbose: 2                                                          # 詳細程度: 0=安靜，1=進度條，2=每輪信息
  print_model_summary: true                                           # 是否打印模型摘要
  log_device_placement: false                                         # 是否記錄設備放置
  profile_execution: false                                            # 是否分析執行時間
  seed_everything: true                                               # 是否固定所有隨機種子